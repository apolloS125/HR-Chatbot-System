services:
  mongodb:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: hr_chatbot
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:8-alpine

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.2
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate

  seaweedfs:
    image: chrislusf/seaweedfs:3.81
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - seaweed_data:/data

  backend:
    build: ./backend
    environment:
      MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0
      MONGODB_DATABASE: hr_chatbot
      REDIS_URL: redis://redis:6379/0
      WEAVIATE_URL: http://weaviate:8080
      SEAWEED_MASTER_URL: http://seaweedfs:9333
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
      HR_USERNAME: ${HR_USERNAME:-hr}
      HR_PASSWORD: ${HR_PASSWORD:-change-me}
      LIFF_SESSION_SECRET: ${LIFF_SESSION_SECRET:-change-me}
      LIFF_ORIGIN: ${LIFF_ORIGIN:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://ai.psu.blue/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-6-luna}
      OPENAI_EMBEDDING_API_KEY: ${OPENAI_EMBEDDING_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      weaviate:
        condition: service_started
      seaweedfs:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID:-}
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:8000}
    environment:
      BACKEND_URL: http://backend:8000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
      HR_USERNAME: ${HR_USERNAME:-hr}
      HR_PASSWORD: ${HR_PASSWORD:-change-me}
      HR_DISPLAY_NAME: ${HR_DISPLAY_NAME:-HR}
      NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID:-}
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  weaviate_data:
  seaweed_data:
