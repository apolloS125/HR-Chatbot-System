name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.9.5
      - run: uv sync --locked
        working-directory: backend
      - run: uv run --locked ruff check app tests
        working-directory: backend
      - run: uv run --locked ruff format --check app tests
        working-directory: backend
      - name: Start disposable test services
        run: docker compose -p hr-ci -f compose.test.yaml up -d --wait --wait-timeout 180
      - name: Unit and integration tests
        working-directory: backend
        env:
          TEST_MONGODB_URL: mongodb://localhost:27018/?replicaSet=rs0&directConnection=true
          TEST_REDIS_URL: redis://localhost:6380/15
        run: uv run --locked pytest
      - name: Stop test services
        if: always()
        run: docker compose -p hr-ci -f compose.test.yaml down --volumes

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
