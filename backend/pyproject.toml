[project]
name = "hr-chatbot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "motor>=3.7,<4",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "uvicorn[standard]>=0.35,<1",
  "pypdf>=6.19.0",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "langchain-text-splitters>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
